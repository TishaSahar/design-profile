name: CI

on:
  push:
  pull_request:

jobs:
  backend-build:
    name: Backend · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

  backend-test:
    name: Backend · Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./... -v -cover -count=1

  frontend-check:
    name: Frontend · Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JS syntax
        run: |
          for f in webui/config/config.js webui/src/api.js webui/src/main.js webui/src/admin.js; do
            node --check "$f"
            echo "OK: $f"
          done
