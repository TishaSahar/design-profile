basePath: /api/v1
definitions:
  handler.HealthResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: ok
        type: string
    type: object
  handler.reorderMediaBody:
    properties:
      media_ids:
        items:
          type: string
        type: array
    required:
    - media_ids
    type: object
  handler.reorderProjectsBody:
    properties:
      category:
        example: residential
        type: string
      project_ids:
        items:
          type: string
        type: array
    required:
    - category
    - project_ids
    type: object
  handler.requestOTPBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handler.updateProjectBody:
    properties:
      category:
        example: residential
        type: string
      cover_media_id:
        type: string
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  handler.verifyOTPBody:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API for Olga's design portfolio.
  title: Design Portfolio API
  version: "1.0"
paths:
  /about/photo:
    get:
      description: Returns the designer's profile photo from config/about/.
      produces:
      - image/jpeg
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
      summary: Get designer profile photo
      tags:
      - contacts
  /admin/projects:
    post:
      consumes:
      - multipart/form-data
      description: Creates a new portfolio project with optional media files.
      parameters:
      - description: Project title
        in: formData
        name: title
        required: true
        type: string
      - description: Project description (max 500 chars)
        in: formData
        name: description
        type: string
      - description: 'Work direction: residential (default) or commercial'
        in: formData
        name: category
        type: string
      - description: Media files (images), stored in the order sent
        in: formData
        name: media
        type: file
      - description: Index of the media file to use as the cover (0-based)
        in: formData
        name: cover_index
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create project (admin)
      tags:
      - admin
  /admin/projects/{id}:
    delete:
      description: Deletes a project and all its associated media.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete project (admin)
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Updates a project's title, description, category (residential by
        default) and cover photo. All fields are replaced, so send the current cover_media_id
        to keep the cover.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.updateProjectBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update project (admin)
      tags:
      - admin
  /admin/projects/{id}/media:
    post:
      consumes:
      - multipart/form-data
      description: Uploads additional image files to an existing project.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: Image file
        in: formData
        name: media
        required: true
        type: file
      - description: Position among the project's photos; appended at the end when
          omitted
        in: formData
        name: sortOrder
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add media to project (admin)
      tags:
      - admin
  /admin/projects/{id}/media/{mediaId}:
    delete:
      description: Removes a single media file from a project.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: Media UUID
        in: path
        name: mediaId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete media file (admin)
      tags:
      - admin
  /admin/projects/{id}/media/order:
    put:
      consumes:
      - application/json
      description: Sets the order of all photos of a project; media_ids must list
        every photo exactly once.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: Photo IDs in the new order
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.reorderMediaBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reorder project photos (admin)
      tags:
      - admin
  /admin/projects/order:
    put:
      consumes:
      - application/json
      description: Sets the order of a category's projects on the public site; project_ids
        must list every project of the category exactly once.
      parameters:
      - description: Category and project IDs in the new order
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.reorderProjectsBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reorder projects of a category (admin)
      tags:
      - admin
  /admin/requests:
    get:
      description: Returns all client project requests.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List project requests (admin)
      tags:
      - admin
  /admin/requests/{id}:
    get:
      description: Returns a single project request with attachment metadata.
      parameters:
      - description: Request UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get project request (admin)
      tags:
      - admin
  /admin/requests/{id}/attachments/{attachmentId}:
    get:
      description: Returns the binary content of a request attachment.
      parameters:
      - description: Request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Attachment UUID
        in: path
        name: attachmentId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Serve attachment file (admin)
      tags:
      - admin
  /auth/request-otp:
    post:
      consumes:
      - application/json
      description: Sends a one-time password to the admin email address. Always returns
        200 to prevent email enumeration.
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.requestOTPBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request OTP
      tags:
      - auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verifies the one-time password and returns a JWT token.
      parameters:
      - description: Email and OTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.verifyOTPBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify OTP
      tags:
      - auth
  /contacts:
    get:
      description: Returns the designer's public contact information (sourced from
        config/about/contacts.yaml and bio.txt).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get designer contacts
      tags:
      - contacts
  /faq:
    get:
      description: Returns the questions and answers shown on the site, in the order
        of config/about/faq.yaml. Each text has Russian ("ru") and, optionally, English
        ("en").
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List FAQ
      tags:
      - content
  /health:
    get:
      description: Reports whether the API and its dependencies (PostgreSQL) are available.
        Returns 503 when a dependency is down. Also served at /health outside the
        API prefix.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health check
      tags:
      - health
  /projects:
    get:
      description: Returns all portfolio projects with their media metadata.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List projects
      tags:
      - projects
  /projects/{id}:
    get:
      description: Returns a single project with all media metadata.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get project
      tags:
      - projects
  /projects/{id}/media/{mediaId}:
    get:
      description: Returns the binary content of a project media file.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: Media UUID
        in: path
        name: mediaId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Serve media file
      tags:
      - projects
  /requests:
    post:
      consumes:
      - multipart/form-data
      description: Submits a new client project request with optional attachments
        (up to 10 photos or 1 PDF).
      parameters:
      - description: First name
        in: formData
        name: first_name
        required: true
        type: string
      - description: Last name
        in: formData
        name: last_name
        required: true
        type: string
      - description: E-mail
        in: formData
        name: email
        required: true
        type: string
      - description: Phone number
        in: formData
        name: phone
        type: string
      - description: Telegram account
        in: formData
        name: telegram
        type: string
      - description: 'Preferred contact method: email, phone or telegram (must be
          filled in; defaults to email)'
        in: formData
        name: preferred_contact
        type: string
      - description: Project description
        in: formData
        name: description
        required: true
        type: string
      - description: Consent to personal data processing
        in: formData
        name: consented
        required: true
        type: boolean
      - description: Attachments (up to 10 images or 1 PDF)
        in: formData
        name: attachments
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Submit project request
      tags:
      - requests
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
