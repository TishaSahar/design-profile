# Частые вопросы (FAQ) на сайте — раздел «07 • Вопросы и ответы».
#
# Как редактировать:
#   • Вопросы показываются на сайте в том же порядке, что и здесь.
#   • Каждый пункт начинается с «- question:», у вопроса и ответа есть ru (обязательно)
#     и en (необязательно: если английского текста нет, показывается русский).
#   • Ответ пишется после «|-» с новой строки, с отступом в 6 пробелов.
#     Пустая строка внутри ответа начинает новый абзац.
#   • Если в вопросе есть двоеточие с пробелом («: »), возьмите вопрос в кавычки.
#
# Шаблон нового вопроса (скопируйте и уберите «#» в начале строк):
#
# - question:
#     ru: Текст вопроса?
#     en: Question text?
#   answer:
#     ru: |-
#       Текст ответа.
#     en: |-
#       Answer text.
#
# Изменения появятся на сайте после деплоя (пуш в main). Если в файле ошибка,
# бэкенд не запустится, и деплой откатится на предыдущую версию — сайт не сломается.
# Проверить файл до пуша: cd backend && go test ./config/about/

- question:
    ru: Как проходит удалённая работа?
    en: How does remote work happen?
  answer:
    ru: |-
      Работа проходит полностью удалённо. Заказчик предоставляет обмеры и видеофиксацию помещения, на основе которых разрабатывается проект. Подбор мебели и материалов осуществляется с учётом ассортимента местного рынка, с предоставлением конкретных позиций и ссылок на покупку. Общение ведётся в удобном мессенджере (Telegram/WhatsApp), а презентация каждого этапа проекта проходит по видеосвязи (Zoom/Google Meet).
    en: |-
      The work is done fully remotely. The client provides measurements and a video recording of the space, on which the project is based. Furniture and materials are selected from what is available on the local market, with specific items and purchase links. We keep in touch in a messenger of your choice (Telegram/WhatsApp), and each project stage is presented over a video call (Zoom/Google Meet).

- question:
    ru: Как сделать обмеры помещения, если мы в разных городах или странах?
    en: How do we measure the space if we are in different cities or countries?
  answer:
    ru: |-
      Для выполнения обмеров необходимо обратиться в местную профессиональную обмерную компанию. Перед замером предоставляется подробное техническое задание с перечнем необходимых данных и материалов. Работа ведётся только на основе профессиональных обмеров, поскольку точность размеров критически важна для разработки чертежей, а самостоятельные замеры могут содержать ошибки. Стоимость обмеров оплачивается отдельно и не входит в стоимость дизайн-проекта.
    en: |-
      Measurements should be taken by a local professional surveying company. Before the survey you receive a detailed brief listing the data and materials required. The project is developed only from professional measurements, because accurate dimensions are critical for the drawings and measurements taken on your own may contain errors. The survey is paid for separately and is not included in the price of the design project.

- question:
    ru: Сколько кругов правок входит в стоимость?
    en: How many revision rounds are included in the price?
  answer:
    ru: |-
      В «Планировочное решение» входят 2 круга правок. В «Чертежи для ремонта» — 1 круг правок. В «Дизайн-концепцию» — 2 круга правок на этапе коллажей и 2 круга правок на этапе 3D-модели в SketchUp. Это обеспечивает предсказуемый результат и соблюдение сроков.
    en: |-
      Space planning includes 2 rounds of revisions. Renovation drawings include 1 round. The design concept includes 2 rounds at the collage stage and 2 rounds at the SketchUp 3D model stage. This keeps the result predictable and the project on schedule.

- question:
    ru: Можно ли заказать только одну услугу, например только планировку или концепцию?
    en: Can I order just one service, for example only the layout or only the concept?
  answer:
    ru: |-
      Да, в этом главная особенность моей практики: все три услуги независимы. Вы можете заказать только планировочное решение или только дизайн-концепцию. Единственное технологическое правило: чертежи для ремонта выполняются после согласованной планировки.
    en: |-
      Yes — this is the key feature of my practice: all three services are independent. You can order only the space plan or only the design concept. The one technical rule is that renovation drawings are prepared after the layout is approved.

- question:
    ru: Подбираете ли вы реальные артикулы мебели и материалов, доступные в моей стране?
    en: Do you select real furniture and materials available in my country?
  answer:
    ru: |-
      Да. В рамках услуги «Дизайн-концепция» я подбираю реальную мебель, свет, сантехнику и отделочные материалы, доступные к заказу в вашем регионе, и оформляю ведомость с артикулами, ориентировочными ценами и прямыми ссылками.
    en: |-
      Yes. As part of the design concept I select real furniture, lighting, plumbing and finishing materials that can be ordered in your region and compile a schedule with product codes, approximate prices and direct links.

- question:
    ru: Какие сроки разработки каждого этапа?
    en: How long does each stage take?
  answer:
    ru: |-
      В среднем планировочное решение занимает 5–8 рабочих дней, рабочие чертежи — 10–14 рабочих дней, дизайн-концепция — 10–14 рабочих дней в зависимости от площади и сложности объекта (квартира, дом или HoReCa).
    en: |-
      On average, space planning takes 5–8 working days, working drawings 10–14 working days and a design concept 10–14 working days, depending on the area and complexity of the property (apartment, house or HoReCa).

- question:
    ru: Работаете ли вы с нашими строителями и подрядчиками?
    en: Do you work with our builders and contractors?
  answer:
    ru: |-
      Да, для строителей и мебельщиков подготавливаются подробные рабочие чертежи и развёртки стен, позволяющие точно рассчитать смету и реализовать проект без догадок. В течение 3 месяцев после передачи проекта предусмотрена онлайн-поддержка: можно обращаться с любыми вопросами и уточнениями по проекту. Дальнейшее сопровождение возможно по договорённости.
    en: |-
      Yes. Builders and furniture makers receive detailed working drawings and wall elevations that let them estimate costs accurately and build the project without guesswork. For 3 months after the project is handed over, online support is included: you can get in touch with any questions or clarifications about the project. Further support is available by arrangement.

- question:
    ru: Что происходит на этапе реализации?
    en: What happens at the implementation stage?
  answer:
    ru: |-
      После передачи финального альбома чертежей и спецификации у вас будет всё необходимое для самостоятельной реализации проекта с выбранными подрядчиками: подробные чертежи, точные привязки и конкретные артикулы со ссылками на покупку. Документация составлена так, чтобы у строителей возникало минимум дополнительных вопросов. При необходимости в течение первых 3 месяцев после передачи проекта предусмотрена онлайн-поддержка по всем вопросам реализации. Дальнейшее сопровождение возможно по договорённости.
    en: |-
      Once you receive the final album of drawings and the specification, you have everything you need to carry out the project yourself with the contractors of your choice: detailed drawings, exact positions and specific product codes with purchase links. The documentation is prepared so that builders have as few additional questions as possible. If needed, online support on any implementation questions is included for the first 3 months after the project is handed over. Further support is available by arrangement.

- question:
    ru: Что не входит в стоимость услуг?
    en: What is not included in the price?
  answer:
    ru: |-
      В стоимость дистанционных услуг не входят обмер помещения, выездной авторский надзор на стройплощадке, инженерные разделы (ОВиК, ВК, электропроект с расчётом нагрузок), а также юридическое согласование перепланировок в местных государственных инстанциях.
    en: |-
      Remote services do not include measuring the space, on-site supervision, engineering sections (HVAC, water supply and drainage, electrical design with load calculations) or legal approval of layout changes with local authorities.
