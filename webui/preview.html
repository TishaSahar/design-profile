<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Превью проекта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/site.css">
  <style>
    /* Admin preview of one project, drawn with the site's own styles (see src/preview.js). */
    .preview { padding-top: 2.5rem; padding-bottom: 4rem; display: grid; gap: 3.5rem; }
    .preview__label { margin-bottom: 1.25rem; color: var(--olive-text); }
    .preview .projects-grid { margin-top: 0; }
    .preview .dialog { margin: 0 auto; }
    .preview a, .preview button { pointer-events: none; }
  </style>
</head>
<body>
  <main class="preview container">
    <section>
      <p class="caps preview__label">Карточка в разделе «Проекты»</p>
      <div class="projects-grid" id="preview-grid"><div class="loader"></div></div>
    </section>
    <section>
      <p class="caps preview__label">Окно проекта — открывается по клику на карточку</p>
      <div class="dialog dialog--wide">
        <div class="dialog__bar">
          <span class="caps" id="case-meta"></span>
          <span class="dialog__close" aria-hidden="true">Закрыть &times;</span>
        </div>
        <div class="dialog__body" id="case-body"></div>
      </div>
    </section>
  </main>
  <script type="module" src="./src/preview.js"></script>
</body>
</html>
